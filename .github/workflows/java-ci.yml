name: Java CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Compile Java files
      run: find . -name "*.java" -exec javac {} +

    - name: Run main class (if exists)
      run: |
        if [ -f "welcome_to_java.class" ]; then
          java welcome_to_java
        fi